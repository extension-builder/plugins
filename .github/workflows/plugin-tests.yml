name: JCB plugin tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: Joomla 6 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      COMPOSER_NO_INTERACTION: '1'
    steps:
      - name: Check out plugin candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out reviewed JCB compiler and test dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: extension-builder/joomla
          ref: e54c39eaf8803d614a522b651507fef0536f81c2
          path: .runtime/jcb
          persist-credentials: false

      - name: Check out Joomla CMS test runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: joomla/joomla-cms
          ref: c623e73b17c749f4644cb5634f59ca683b69d17b # 6.1.2
          path: .runtime/jcb/libraries/vendor_jcb/tests/.runtime/joomla-cms
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, fileinfo, gd, intl, ldap, mbstring, openssl, pdo_sqlite, simplexml, sodium, xml, xmlwriter, zip
          ini-values: memory_limit=1G
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027

      - name: Install reviewed test dependency lock
        working-directory: .runtime/jcb/libraries/vendor_jcb/tests
        run: |
          composer validate --strict
          composer install --prefer-dist --no-progress
          composer check-platform-reqs

      - name: Check plugin PHP syntax
        run: find plg_* -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run actual plugin and compiler regressions
        run: bash tests/run.sh
